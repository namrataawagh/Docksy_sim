# ═══════════════════════════════════════════════════════════════════
#  ROS-GZ Bridge Configuration
#  Stack : ROS 2 Jazzy + Gazebo Harmonic
#
#  CRITICAL RULE for Gazebo Harmonic:
#  Sensor topics MUST use the full world-scoped gz_topic_name:
#    /world/<world_name>/model/<model_name>/link/<link_name>/sensor/<sensor_name>/<type>
#  Using bare topic names (e.g., /scan, /imu) finds nothing in GZ —
#  even if the xacro <topic> tag uses a leading slash, Gazebo Harmonic
#  still publishes sensors under the full scoped path.
#
#  Model-scoped topics (tf, odom, cmd_vel, joint_state) from plugins
#  use /model/<model_name>/... — NOT world-scoped.
#
#  CLOCK is intentionally absent from this file.
#  It is bridged by a dedicated node in the launch file to avoid the
#  Gazebo bidirectional clock publisher conflict bug.
#  Reference: github.com/gazebosim/ros_gz/issues/341
# ═══════════════════════════════════════════════════════════════════

# ── 1. LiDAR Scan ──────────────────────────────────────────────────
# Sensor: lidar_link / lidar_sensor in sensors.xacro
- ros_topic_name: "/scan"
  gz_topic_name: "/scan"
  ros_type_name: "sensor_msgs/msg/LaserScan"
  gz_type_name: "gz.msgs.LaserScan"
  direction: GZ_TO_ROS

# ── 2. IMU ─────────────────────────────────────────────────────────
# Sensor: imu_link / imu_sensor in sensors.xacro
# <topic>/imu</topic> with leading slash → Gazebo publishes to bare /imu
- ros_topic_name: "/imu"
  gz_topic_name: "/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# ── 3. Camera image ────────────────────────────────────────────────
# Sensor: camera_link / camera in camera.xacro
- ros_topic_name: "/camera/image_raw"
  gz_topic_name: "/world/parking_world/model/my_robot/link/camera_link/sensor/camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

# ── 4. Camera info ─────────────────────────────────────────────────
- ros_topic_name: "/camera/camera_info"
  gz_topic_name: "/world/parking_world/model/my_robot/link/camera_link/sensor/camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# ── 5. Odometry (diff-drive plugin — model-scoped, not world-scoped) ─
- ros_topic_name: "/odom"
  gz_topic_name: "/model/my_robot/odometry"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# ── 6. Joint states ────────────────────────────────────────────────
- ros_topic_name: "/joint_states"
  gz_topic_name: "/world/parking_world/model/my_robot/joint_state"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# ── 7. TF from diff-drive plugin (odom → base_footprint) ───────────
- ros_topic_name: "/tf"
  gz_topic_name: "/model/my_robot/tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

# ── 8. cmd_vel (ROS → GZ — robot actuation) ────────────────────────
- ros_topic_name: "/cmd_vel"
  gz_topic_name: "/model/my_robot/cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ
